<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内容管理</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f5;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
        .container{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,0.08);padding:32px;max-width:520px;width:100%}
        h1{font-size:22px;color:#1a1a2e;font-weight:600;margin-bottom:4px}
        .subtitle{color:#6b7280;font-size:13px;margin-bottom:24px;padding-bottom:14px;border-bottom:1px solid #eaeaea}
        .form-group{margin-bottom:18px}
        label{display:block;font-weight:500;font-size:13px;color:#1a1a2e;margin-bottom:4px}
        label .required{color:#dc3545;margin-left:2px}
        input,textarea,select{width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;font-family:inherit;background:#fafafa;transition:border-color .2s}
        input:focus,textarea:focus,select:focus{outline:none;border-color:#456995;background:#fff;box-shadow:0 0 0 3px rgba(69,105,149,0.12)}
        textarea{resize:vertical;min-height:100px}
        .radio-group{display:flex;gap:24px;padding:4px 0}
        .radio-group label{display:flex;align-items:center;gap:6px;font-weight:400;font-size:14px;cursor:pointer}
        .radio-group input[type=radio]{width:16px;height:16px;accent-color:#456995;cursor:pointer}
        .btn{width:100%;padding:10px;background:#456995;color:#fff;border:none;border-radius:6px;font-size:15px;font-weight:500;cursor:pointer;transition:background .2s;display:flex;justify-content:center;align-items:center;gap:8px}
        .btn:hover{background:#3a5a7d}
        .btn:disabled{background:#9ca3af;cursor:not-allowed}
        .btn .spinner{display:none;width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
        .btn.loading .spinner{display:inline-block}
        .btn.loading .btn-text{display:none}
        @keyframes spin{to{transform:rotate(360deg)}}
        #message{margin-top:14px;padding:10px 14px;border-radius:6px;display:none;font-size:14px;font-weight:500}
        #message.success{display:block;background:#e6f7e6;color:#0a5e0a;border:1px solid #b3e0b3}
        #message.error{display:block;background:#fde8e8;color:#8b1a1a;border:1px solid #f5c2c2}
        #message.info{display:block;background:#e8f0fe;color:#1a3a7a;border:1px solid #b8cce8}
        .config-bar{background:#f8f9fa;border-radius:6px;padding:12px 16px;margin-bottom:20px;border:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center}
        .config-bar .status{font-size:13px;color:#6b7280}
        .config-bar .status .ready{color:#16a34a;font-weight:500}
        .config-bar .status .missing{color:#dc2626;font-weight:500}
        .config-link{color:#456995;font-size:13px;font-weight:500;text-decoration:none;padding:4px 12px;border:1px solid #456995;border-radius:4px;transition:background .2s,color .2s}
        .config-link:hover{background:#456995;color:#fff}
        .hidden{display:none!important}
    </style>
</head>
<body>

<div class="container">
    <h1>内容发布</h1>
    <p class="subtitle">发布博客或公告，自动更新网站</p>

    <div class="config-bar" id="configBar">
        <span class="status" id="tokenStatus">
            <span class="missing">未配置</span> Token
        </span>
        <a href="Sign/sign-Token.html" class="config-link" id="configLink">点击配置有关信息</a>
    </div>

    <form id="publishForm">
        <div class="form-group">
            <label>发布类型</label>
            <div class="radio-group">
                <label><input type="radio" name="type" value="blog" checked> 博客</label>
                <label><input type="radio" name="type" value="notice"> 公告</label>
            </div>
        </div>

        <div id="blogFields">
            <div class="form-group">
                <label>作者 <span class="required">*</span></label>
                <input type="text" id="author" placeholder="例如: peter" value="peter">
            </div>
            <div class="form-group">
                <label>日期 <span class="required">*</span></label>
                <input type="date" id="date">
            </div>
            <div class="form-group">
                <label>文章标题 <span class="required">*</span></label>
                <input type="text" id="title" placeholder="例如: Hello World">
            </div>
        </div>

        <div id="noticeFields" class="hidden">
            <div class="form-group">
                <label>公告日期 <span class="required">*</span></label>
                <input type="date" id="noticeDate">
            </div>
        </div>

        <div class="form-group">
            <label>正文内容 <span class="required">*</span></label>
            <textarea id="content" placeholder="输入内容..."></textarea>
        </div>

        <button type="submit" class="btn" id="submitBtn" disabled>
            <span class="spinner"></span>
            <span class="btn-text">发布</span>
        </button>
    </form>

    <div id="message"></div>
</div>

<script>
(function() {
    const DB_NAME = 'TokenDB';
    const STORE_NAME = 'tokens';
    const KEY_NAME = 'Token';
    const OWNER = 'ytxxpia';
    const REPO = 'FamilyWeb4New-2026.7.1';
    const CATEGORY = 'General';

    const form = document.getElementById('publishForm');
    const typeRadios = document.querySelectorAll('input[name="type"]');
    const blogFields = document.getElementById('blogFields');
    const noticeFields = document.getElementById('noticeFields');
    const authorInput = document.getElementById('author');
    const dateInput = document.getElementById('date');
    const titleInput = document.getElementById('title');
    const noticeDateInput = document.getElementById('noticeDate');
    const contentInput = document.getElementById('content');
    const submitBtn = document.getElementById('submitBtn');
    const messageEl = document.getElementById('message');
    const tokenStatus = document.getElementById('tokenStatus');
    const configLink = document.getElementById('configLink');

    let cachedToken = null;

    function openDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, 1);
            request.onupgradeneeded = function(e) {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME);
                }
            };
            request.onsuccess = function(e) { resolve(e.target.result); };
            request.onerror = function(e) { reject(e.target.error); };
        });
    }

    function getTokenFromDB() {
        return openDB().then(db => {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const request = store.get(KEY_NAME);
                request.onsuccess = function() { resolve(request.result || null); };
                request.onerror = function() { reject(request.error); };
                tx.oncomplete = function() { db.close(); };
            });
        }).catch(() => null);
    }

    function updateTokenUI(token) {
        if (token && token.length > 0) {
            cachedToken = token;
            tokenStatus.innerHTML = '<span class="ready">已配置</span> Token';
            configLink.textContent = '重新配置';
            submitBtn.disabled = false;
        } else {
            cachedToken = null;
            tokenStatus.innerHTML = '<span class="missing">未配置</span> Token';
            configLink.textContent = '点击配置有关信息';
            submitBtn.disabled = true;
            hideMessage();
        }
    }

    function loadToken() {
        getTokenFromDB().then(token => {
            updateTokenUI(token);
        }).catch(() => {
            updateTokenUI(null);
        });
    }

    function setDefaultDate() {
        const today = new Date().toISOString().split('T')[0];
        dateInput.value = today;
        noticeDateInput.value = today;
    }

    function showMessage(type, text) {
        messageEl.className = type;
        messageEl.textContent = text;
        messageEl.style.display = 'block';
    }

    function hideMessage() {
        messageEl.style.display = 'none';
    }

    typeRadios.forEach(radio => {
        radio.addEventListener('change', function() {
            if (this.value === 'blog') {
                blogFields.classList.remove('hidden');
                noticeFields.classList.add('hidden');
            } else {
                blogFields.classList.add('hidden');
                noticeFields.classList.remove('hidden');
            }
        });
    });

    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const token = cachedToken;
        if (!token) {
            showMessage('error', '请先配置 Token');
            return;
        }

        const type = document.querySelector('input[name="type"]:checked').value;
        let title, body, discussionTitle;

        if (type === 'blog') {
            const author = authorInput.value.trim();
            const date = dateInput.value;
            const titleVal = titleInput.value.trim();
            const content = contentInput.value.trim();

            if (!author) { showMessage('error', '请输入作者'); return; }
            if (!date) { showMessage('error', '请选择日期'); return; }
            if (!titleVal) { showMessage('error', '请输入文章标题'); return; }
            if (!content) { showMessage('error', '请输入正文内容'); return; }

            discussionTitle = '博客: ' + titleVal;
            body = '//w-' + author + '@d-' + date + '@n-' + titleVal + '//\n\n' + content;
        } else {
            const date = noticeDateInput.value;
            const content = contentInput.value.trim();

            if (!date) { showMessage('error', '请选择日期'); return; }
            if (!content) { showMessage('error', '请输入公告内容'); return; }

            discussionTitle = '公告: ' + date;
            body = '//d-' + date + '//\n\n' + content;
        }

        submitBtn.disabled = true;
        submitBtn.classList.add('loading');
        hideMessage();

        try {
            const response = await fetch(
                'https://api.github.com/repos/' + OWNER + '/' + REPO + '/discussions',
                {
                    method: 'POST',
                    headers: {
                        'Authorization': 'token ' + token,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: discussionTitle,
                        body: body,
                        category: CATEGORY
                    })
                }
            );

            const data = await response.json();

            if (response.ok) {
                showMessage('success', '发布成功: ' + discussionTitle);
                contentInput.value = '';
                if (type === 'blog') titleInput.value = '';
            } else {
                let errMsg = data.message || '未知错误';
                if (response.status === 401) errMsg = 'Token 无效或权限不足';
                else if (response.status === 403) errMsg = 'API 限流或权限不足';
                else if (response.status === 404) errMsg = '仓库不存在';
                showMessage('error', '发布失败 (' + response.status + '): ' + errMsg);
            }
        } catch (err) {
            showMessage('error', '网络错误: ' + err.message);
        } finally {
            submitBtn.disabled = false;
            submitBtn.classList.remove('loading');
        }
    });

    contentInput.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.key === 'Enter') {
            form.dispatchEvent(new Event('submit'));
        }
    });

    setDefaultDate();
    loadToken();

    document.addEventListener('visibilitychange', function() {
        if (!document.hidden) {
            loadToken();
        }
    });
})();
</script>
</body>
</html>
